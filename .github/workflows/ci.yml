name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: 单元与集成测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 项目零依赖，无需 npm install；node:sqlite 在 Node 24 已默认可用
      - name: 接口集成测试（22 项）
        run: node --test tests/api.test.js

      - name: 静态资源冒烟测试
        run: node tests/smoke.mjs

  docker:
    name: 构建并推送镜像
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像标签
        id: meta
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME,,}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:latest"
            echo "${IMAGE}:v${{ steps.ver.outputs.version }}"
            echo "${IMAGE}:sha-${SHORT_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}

      - name: 拉起容器做冒烟验证
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
        run: |
          set -e
          cleanup() { docker rm -f "$1" > /dev/null 2>&1 || true; }

          # 场景一：镜像内建 /data（无挂载卷）
          docker run -d --name nianlun-smoke -p 18080:8080 \
            -e PORT=8080 -e DATA_DIR=/data "${IMAGE}:sha-${SHORT_SHA}"

          # 场景二：挂载一个 root 属主的宿主机目录（复现用户 NAS 上 Docker 自动建目录的情况）
          mkdir -p "${GITHUB_WORKSPACE}/data-smoke"
          docker run -d --name nianlun-smoke-bind -p 18081:8080 \
            -e PORT=8080 -e DATA_DIR=/data \
            -v "${GITHUB_WORKSPACE}/data-smoke:/data" "${IMAGE}:sha-${SHORT_SHA}"

          check() {
            local name="$1" port="$2" cid="$3"
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${port}/api/health" > /dev/null 2>&1; then
                echo "✓ ${name} 健康检查通过"
                curl -fsS "http://127.0.0.1:${port}/api/health"; echo
                # 真正写一次数据，确认 SQLite 可写而不只是能起进程
                code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                  -H 'Content-Type: application/json' \
                  -d '{"username":"smoke","password":"Smoke12345","seedTemplates":true}' \
                  "http://127.0.0.1:${port}/api/setup/admin")
                if [ "$code" = "200" ]; then
                  echo "✓ ${name} SQLite 写入验证通过（初始化管理员成功）"
                  cleanup "$cid"
                  return 0
                fi
                echo "::error::${name} 初始化管理员失败，HTTP ${code}"
                docker logs "$cid"
                cleanup "$cid"
                return 1
              fi
              sleep 2
            done
            echo "::error::${name} 健康检查失败"
            docker logs "$cid"
            cleanup "$cid"
            return 1
          }

          check "镜像内建数据目录" 18080 nianlun-smoke
          check "挂载 root 属主目录" 18081 nianlun-smoke-bind
          # 目录已被入口脚本 chown 成 uid 1000，runner 用户删不掉，用 sudo 清理
          sudo rm -rf "${GITHUB_WORKSPACE}/data-smoke" || true
