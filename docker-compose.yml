services:
  nianlun:
    build:
      context: .
    # 想直接用 CI 构建好的镜像，注释掉上面的 build: 并打开下面这行
    # image: ghcr.io/gaoab1/nianlun:latest
    image: nianlun:1.0.0
    container_name: nianlun
    restart: unless-stopped

    ports:
      # 左边是宿主机端口，按需改成 8081 / 9000 等
      - "8080:8080"

    environment:
      TZ: Asia/Shanghai
      SITE_NAME: 年轮
      PORT: "8080"
      DATA_DIR: /data
      # 用 HTTPS 反向代理（Nginx / Caddy / 群晖反代）时打开下面这行，
      # 让会话 Cookie 只在加密连接上传输。用 IP 直连时保持注释。
      # COOKIE_SECURE: "1"

    volumes:
      # SQLite 数据库与上传的图片都在这里，务必持久化
      - ./data:/data
      # 群晖 / QNAP 也可以换成绝对路径，例如：
      # - /volume1/docker/nianlun/data:/data

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 8s
      retries: 3

    # 家用 NAS 内存有限，顺手限制日志体积
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
